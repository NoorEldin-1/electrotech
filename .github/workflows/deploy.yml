name: Deploy to Production

on:
  # Deploy only after the `tests` workflow has finished green on main.
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to CyberPanel server
    runs-on: ubuntu-latest
    # Manual runs always deploy. Automatic runs need green tests and no
    # [no-deploy] marker in the tested commit message.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       !contains(github.event.workflow_run.head_commit.message, '[no-deploy]'))
    permissions:
      contents: read

    steps:
      - name: Configure SSH client
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Best-effort known_hosts pre-fill. Non-fatal: the deploy step uses
          # StrictHostKeyChecking=no, so it does not depend on this. ssh-keyscan
          # can exit non-zero (host unreachable, missing SSH_PORT/SSH_HOST) and
          # must not abort the whole deploy.
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run remote deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          # The repository is private and the server holds no GitHub
          # credentials. The job's own token (read-only, expires when the job
          # ends) is used for this one fetch and never written to the server's
          # git config — so the fetch targets a URL, not the `origin` remote.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "set -e; cd '$DEPLOY_PATH' && git fetch 'https://x-access-token:$GH_TOKEN@github.com/$REPO.git' +refs/heads/main:refs/remotes/origin/main && git checkout main && git reset --hard origin/main && SKIP_GIT_FETCH=1 bash deploy.sh"
