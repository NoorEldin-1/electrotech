name: tests

on:
  push:
    branches:
      - main
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, gd, zip, bcmath, fileinfo
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Some feature tests render full Filament pages whose layout calls @vite,
      # which needs public/build/manifest.json to exist.
      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # paratest is not in composer.json, so the suite runs serially.
      - name: Run tests
        run: |
          if [ -f vendor/bin/paratest ]; then
            php artisan test --parallel
          else
            php artisan test
          fi

  # Browser end-to-end suite (Playwright, tests/e2e). It runs only here: the
  # app is migrated and seeded into a sqlite FILE database, served with
  # `php artisan serve` (started by Playwright's webServer), and driven in
  # headless chromium. The deploy workflow waits for the whole `tests`
  # workflow, so a red spec blocks the production deploy like a red PHPUnit.
  e2e:
    name: E2E (Playwright)
    needs: phpunit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    # Real environment variables win over .env (phpdotenv never overwrites
    # them), so the run needs no edits to the copied .env.example.
    env:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://127.0.0.1:8000
      # The production language; the specs match Arabic and English alike.
      APP_LOCALE: ar
      APP_FALLBACK_LOCALE: en
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/e2e.sqlite
      # array: no cross-request cache, which also turns the login throttle
      # off (every role signs in a few times in a minute).
      CACHE_STORE: array
      PERMISSION_CACHE_STORE: array
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      BCRYPT_ROUNDS: '4'
      NETWORK_RESILIENCE_ENABLED: 'false'
      E2E_PORT: '8000'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, gd, zip, bcmath, fileinfo
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch "$DB_DATABASE"
          mkdir -p storage/app/e2e
          php artisan storage:link

      # Production seeders first (roles, permissions, chart of accounts, demo
      # users), then the deterministic E2E data on top.
      - name: Migrate and seed
        run: |
          php artisan migrate:fresh --seed --force
          php artisan db:seed --class='Database\Seeders\E2eSeeder' --force

      - name: Install Playwright
        working-directory: tests/e2e
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.49.1

      - name: Install chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: tests/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-laravel-log
          path: storage/logs/
          if-no-files-found: ignore
          retention-days: 14
