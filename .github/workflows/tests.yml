name: tests

on:
  push:
    branches:
      - main
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, gd, zip, bcmath, fileinfo
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Some feature tests render full Filament pages whose layout calls @vite,
      # which needs public/build/manifest.json to exist.
      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # paratest is not in composer.json, so the suite runs serially.
      - name: Run tests
        run: |
          if [ -f vendor/bin/paratest ]; then
            php artisan test --parallel
          else
            php artisan test
          fi

  # Browser end-to-end suite (Playwright, tests/e2e). It runs only here: the
  # app is migrated and seeded into a sqlite FILE database, served by
  # `php -S` (tests/e2e/support/serve.sh, started in its own step and restarted
  # if it ever dies), and driven in
  # headless chromium. The deploy workflow waits for the whole `tests`
  # workflow, so a red spec blocks the production deploy like a red PHPUnit.
  e2e:
    name: E2E (Playwright)
    needs: phpunit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    # Real environment variables win over .env (phpdotenv never overwrites
    # them) for every artisan command and for the php -S server, which inherits
    # this environment. "Prepare the application" also writes the same values
    # into .env, so anything that reads .env alone (a tinker session, a later
    # `php artisan serve`) sees the same database, cache and locale.
    env:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://127.0.0.1:8000
      # The production language; the specs match Arabic and English alike.
      APP_LOCALE: ar
      APP_FALLBACK_LOCALE: en
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/e2e.sqlite
      # array: no cross-request cache, which also turns the login throttle
      # off (every role signs in a few times in a minute).
      CACHE_STORE: array
      PERMISSION_CACHE_STORE: array
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      BCRYPT_ROUNDS: '4'
      NETWORK_RESILIENCE_ENABLED: 'false'
      E2E_PORT: '8000'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, gd, zip, bcmath, fileinfo
          coverage: none
          # The tracing JIT that setup-php enables corrupts memory in a long-running
          # php -S (see tests/e2e/support/serve.sh); the job has no use for it.
          ini-values: opcache.jit=disable, opcache.jit_buffer_size=0

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Playwright
        working-directory: tests/e2e
        run: npm install --no-audit --no-fund

      # Fail fast, before the application is built, migrated and seeded: a typo
      # or a mangled escape in a spec would otherwise only surface as a cryptic
      # load failure inside Playwright at the very end of the job.
      - name: Type-check the E2E suite
        working-directory: tests/e2e
        run: npx tsc --noEmit -p .

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate
          # Mirror the job environment into .env (drop the .env.example line of
          # the same name first, so the served app and the artisan commands
          # agree on every one of these).
          for key in APP_ENV APP_DEBUG APP_URL APP_LOCALE APP_FALLBACK_LOCALE \
                     DB_CONNECTION DB_DATABASE CACHE_STORE PERMISSION_CACHE_STORE \
                     SESSION_DRIVER QUEUE_CONNECTION MAIL_MAILER BCRYPT_ROUNDS \
                     NETWORK_RESILIENCE_ENABLED; do
            sed -i "/^${key}=/d" .env
            printf '%s=%s\n' "$key" "${!key}" >> .env
          done
          touch "$DB_DATABASE"
          mkdir -p storage/app/e2e
          php artisan storage:link

      # Production seeders first (roles, permissions, chart of accounts, demo
      # users), then the deterministic E2E data on top.
      - name: Migrate and seed
        run: |
          php artisan migrate:fresh --seed --force
          php artisan db:seed --class='Database\Seeders\E2eSeeder' --force

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.49.1

      - name: Install chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      # The server is started here, not by Playwright's webServer option, so
      # it is not a child of the test runner and its output is kept in
      # storage/logs/e2e-server.log (uploaded below). serve.sh restarts php -S
      # if it dies and records the exit status.
      - name: Start the application server
        run: |
          setsid nohup bash tests/e2e/support/serve.sh "$E2E_PORT" > /dev/null 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://127.0.0.1:${E2E_PORT}/admin/login"; then
              echo "server is answering"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the application server did not start"
          cat storage/logs/e2e-server.log || true
          exit 1

      - name: Run Playwright
        working-directory: tests/e2e
        env:
          # Tells playwright.config.ts to use the server started above.
          E2E_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test

      # A php -S crash would otherwise only show up as ERR_CONNECTION_REFUSED /
      # ERR_EMPTY_RESPONSE in a spec; the supervisor log says what happened.
      - name: Report application server crashes
        if: always()
        run: |
          if grep -q "EXITED" storage/logs/e2e-server.log 2>/dev/null; then
            echo "::warning::php -S exited while the E2E suite was running (the supervisor restarted it)"
            grep -n -B5 "EXITED" storage/logs/e2e-server.log | grep -v "URI:" | tail -60
          fi
          grep -nE "Fatal|Segmentation|Allowed memory|Maximum execution" storage/logs/e2e-server.log 2>/dev/null | tail -20 || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-laravel-log
          path: storage/logs/
          if-no-files-found: ignore
          retention-days: 14
