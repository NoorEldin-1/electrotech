name: '2. Profile'
description: |-

  The signed-in user's own account: who am I, edit my details, change my
  password. Managing *other* users lives under "Users" and is permission-gated.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/auth/me
    metadata:
      custom: []
      groupName: '2. Profile'
      groupDescription: |-

        The signed-in user's own account: who am I, edit my details, change my
        password. Managing *other* users lives under "Users" and is permission-gated.
      subgroup: ''
      subgroupDescription: ''
      title: 'Who am I'
      description: |-
        Returns the caller's profile, roles, and the full flat permission list.

        Call this right after login and on app resume: the permission array is
        what the app uses to decide which menu items and buttons to show. It is
        a UX affordance only — every endpoint re-checks server-side, so a stale
        client list can never grant access.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {ACCESS_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"data":{"id":1,"type":"user","name":"System Administrator","email":"admin@example.com","email_verified_at":null,"created_at":"2026-01-01T00:00:00+00:00","updated_at":"2026-01-01T00:00:00+00:00","roles":[{"id":1,"name":"Admin"}],"permissions":["projects.view","projects.create"]},"meta":{"request_id":"9f1c...","api_version":"1"}}'
        headers: []
        description: Success
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 3V5EgbkvZcDPa166h8fd4ae'
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/change-password
    metadata:
      custom: []
      groupName: '2. Profile'
      groupDescription: |-

        The signed-in user's own account: who am I, edit my details, change my
        password. Managing *other* users lives under "Users" and is permission-gated.
      subgroup: ''
      subgroupDescription: ''
      title: 'Change my password'
      description: |-
        Requires the current password. On success **every other device is signed
        out** — the device making the call keeps working, so the user is not
        kicked out of the app they are holding.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {ACCESS_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      current_password:
        custom: []
        name: current_password
        description: 'The password in use right now.'
        required: true
        example: oldsecret1
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: 'The new password: at least 8 characters with letters and numbers.'
        required: true
        example: newsecret1
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password_confirmation:
        custom: []
        name: password_confirmation
        description: 'Must match `password`.'
        required: true
        example: newsecret1
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      current_password: oldsecret1
      password: newsecret1
      password_confirmation: newsecret1
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"data":{"other_devices_signed_out":2},"meta":{"request_id":"9f1c...","api_version":"1"}}'
        headers: []
        description: Success
      -
        custom: []
        status: 422
        content: '{"error":{"code":"validation_failed","message":"The current password is incorrect.","details":{"current_password":["The current password is incorrect."]}},"meta":{"request_id":"9f1c...","api_version":"1"}}'
        headers: []
        description: 'Wrong current password'
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 3V5EgbkvZcDPa166h8fd4ae'
    controller: null
    method: null
    route: null
