  '/api/v1/journal-entries/{journal_entry_id}/lines':
    put:
      summary: 'Write both sides of a draft entry'
      operationId: writeBothSidesOfADraftEntry
      description: "Rows carrying an `id` are updated in place, new rows are created, and\nrows left out are deleted — in one transaction, so a half-written entry\ncan never reach the books. Rows with no `account_id` are ignored, which\nis what lets a client send the empty row a form always has at the\nbottom.\n\nThe totals are recomputed afterwards, so `totals.balanced` in the\nresponse tells you straight away whether the entry can be posted."
      parameters: []
      responses:
        200:
          description: Written
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 77
                    type: journal_entry
                    totals:
                      debit: '40000.00'
                      credit: '40000.00'
                      balanced: true
