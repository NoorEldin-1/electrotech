                            example: posted
                          label:
                            type: string
                            example: Posted
                          color:
                            type: string
                            example: success
                      total_value:
                        type: string
                        example: '15000.00'
                      signed_at:
                        type: string
                        example: '2026-09-12T09:15:00+00:00'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
        422:
          description: ''
