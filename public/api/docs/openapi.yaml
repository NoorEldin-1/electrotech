  '/api/v1/projects/{project_id}/close-cost-center':
    post:
      summary: "Close an operation's cost centre"
      operationId: closeAnOperationsCostCentre
      description: "Posts the journal entry that moves the unclosed balance from inventory to\ncost of goods sold, and records the closing.\n\nThe amount is **not** a parameter: what gets carried is the operation's\nunclosed balance, computed from what it actually consumed. A figure typed\nby hand would be a number nothing reconciles against."
      parameters: []
      responses:
        201:
          description: Closed
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 5
                    type: cost_center_closing
                    project_id: 4
                    amount: '430000.00'
                    is_automatic: false
                    journal_entry_id: 79
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      type:
                        type: string
                        example: cost_center_closing
                      project_id:
                        type: integer
                        example: 4
                      amount:
                        type: string
                        example: '430000.00'
                      is_automatic:
                        type: boolean
                        example: false
                      journal_entry_id:
                        type: integer
                        example: 79
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Nothing delivered'
                    type: object
                    example:
                      error:
                        code: business_rule_violated
                        message: 'Operation 2026-14 has no active delivery, so its cost centre cannot be closed.'
                      meta:
                        request_id: 9f1c
                        api_version: '1'
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            type: string
                            example: business_rule_violated
                          message:
