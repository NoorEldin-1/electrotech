      operationId: completeTheOrder
      description: "The accounting moment. In one transaction it produces every finished\nproduct into the finished-goods warehouse, consumes the materials this\norder pulled into work-in-progress, and writes one production entry per\nproduct carrying the planned-vs-actual loss (الفاقد).\n\nOn a multi-product order the single pot of material cost is apportioned\nacross the products by their share of the planned quantity, with the\nremainder given to the last line — so the per-product rows are\nmeaningful and their totals stay penny-identical to the order's own.\n\nRequires QA approval and QA Review status."
      parameters: []
      responses:
        200:
          description: Completed
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 31
                    type: work_order
                    status:
                      value: completed
                      label: Completed
                      color: success
                    schedule:
                      actual_end_date: '2026-09-12T17:00:00+00:00'
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 31
                      type:
                        type: string
                        example: work_order
                      status:
                        type: object
                        properties:
                          value:
                            type: string
                            example: completed
                          label:
                            type: string
                            example: Completed
                          color:
                            type: string
                            example: success
                      schedule:
                        type: object
                        properties:
