    delete:
      summary: 'Delete an account'
      operationId: deleteAnAccount
      description: "Refused when the account already carries journal lines, or when it has\nsub-accounts. Both refusals protect something that cannot be rebuilt: a\ndeleted account would leave posted lines pointing at nothing, and a\ndeleted parent would orphan a whole branch of the chart.\n\nDeactivate it instead — `is_active: false` keeps the history readable\nwhile stopping anyone posting to it again."
      parameters: []
      responses:
        204:
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                example: {  }
                properties: {  }
        422:
          description: 'Has journal lines'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: business_rule_violated
                    message: 'Cannot delete an account that already carries journal lines.'
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: business_rule_violated
                      message:
                        type: string
                        example: 'Cannot delete an account that already carries journal lines.'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
      tags:
        - '29. Chart of accounts'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the account.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: account
        description: 'The account id.'
        example: 12
