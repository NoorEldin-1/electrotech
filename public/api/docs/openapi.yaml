  '/api/v1/cost-center-closings/{cost_center_closing_id}/reverse':
    post:
      summary: 'Reverse a closing'
      operationId: reverseAClosing
      description: "Writes the mirror-image journal entry (Dr inventory / Cr COGS) and a\nnegative closing row linked to the original. Nothing is deleted, and the\noperation's unclosed balance comes back on its own.\n\nRefused on a row that is itself a reversal, and on one that has already\nbeen reversed — reversing a reversal twice would quietly double the\ncorrection."
      parameters: []
      responses:
        201:
          description: Reversed
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 6
                    type: cost_center_closing
                    amount: '-430000.00'
                    is_reversal: true
                    reverses_id: 5
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 6
                      type:
                        type: string
                        example: cost_center_closing
                      amount:
                        type: string
                        example: '-430000.00'
                      is_reversal:
                        type: boolean
                        example: true
                      reverses_id:
                        type: integer
                        example: 5
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
        422:
          description: 'Already reversed'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: business_rule_violated
                    message: 'This closing has already been reversed.'
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: business_rule_violated
                      message:
                        type: string
                        example: 'This closing has already been reversed.'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
      tags:
        - '36. Cost-centre closing'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 'optional Why it is being undone.'
                  example: 'Delivery voucher was cancelled by the customer'
                  nullable: true
    parameters:
