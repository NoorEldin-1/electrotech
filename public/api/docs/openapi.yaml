      description: "Idempotent and race-safe: an order never has two sheets. If one already\nexists this returns it unchanged — including a sheet that is already\napproved — so a client can call it without checking first.\n\nA new sheet is seeded with ten blank rows and a **snapshot** of the\norder's technical specification. The snapshot is taken once: editing the\norder afterwards does not change a sheet that already exists, because a\ncertificate must keep saying what was actually tested."
      parameters: []
      responses:
        200:
          description: 'Existing sheet returned'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 12
                    type: quality_sheet
                    sheet_number: QS-202609-0007
                    status:
                      value: draft
                      label: Draft
                      color: gray
                    lines_count: 10
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 12
                      type:
                        type: string
                        example: quality_sheet
                      sheet_number:
                        type: string
                        example: QS-202609-0007
