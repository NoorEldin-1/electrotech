                        type: string
                        example: 'Manufacturing order WO-202609-0004 cannot be completed without QA approval.'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
