  '/api/v1/boms/{bom_id}/items':
    put:
      summary: 'Replace the material lines'
      operationId: replaceTheMaterialLines
      description: "Sends the whole list of materials in one request; whatever was there\nbefore is replaced. Same reasoning as the BOQ endpoint: a phone on a weak\nlink cannot reliably sequence per-line adds, edits and deletes, and one\natomic replace is a decision it can retry safely.\n\nOnly allowed while the BOM is unapproved."
