  '/api/v1/purchase-orders/{purchase_order_id}/receive':
    post:
      summary: 'Receive goods against a purchase order'
      operationId: receiveGoodsAgainstAPurchaseOrder
      description: "Send the quantities that actually arrived, keyed by **purchase order\nitem id** — not item id, because one order may hold the same material on\ntwo lines at two prices.\n\nThis raises and posts an addition voucher (إذن إضافة). That single\ndocument adds the stock, credits the supplier, and re-derives the order's\nstatus by comparing ordered against received. The **voucher** is what\ncomes back, because its number is what the warehouse writes on the\npaperwork.\n\nA quantity above a line's `remaining_quantity` is refused outright rather\nthan capped: over-receipt means the delivery note and the order disagree,\nand silently accepting the smaller number would hide that."
      parameters: []
      responses:
        201:
          description: Received
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 15
                    type: addition_voucher
                    voucher_number: AV-202609-0031
                    status:
                      value: posted
                      label: Posted
                      color: success
                    purchase_order_id: 4
                    lines:
                      -
                        item_id: 7
                        quantity: '40.0000'
                        unit_cost: '1000.00'
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 15
                      type:
                        type: string
                        example: addition_voucher
                      voucher_number:
                        type: string
                        example: AV-202609-0031
                      status:
                        type: object
                        properties:
                          value:
                            type: string
                            example: posted
                          label:
                            type: string
                            example: Posted
                          color:
                            type: string
                            example: success
                      purchase_order_id:
                        type: integer
                        example: 4
                      lines:
                        type: array
                        example:
                          -
                            item_id: 7
                            quantity: '40.0000'
                            unit_cost: '1000.00'
                        items:
                          type: object
                          properties:
                            item_id:
                              type: integer
                              example: 7
                            quantity:
                              type: string
                              example: '40.0000'
                            unit_cost:
                              type: string
                              example: '1000.00'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
        422:
          description: 'More than ordered'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: business_rule_violated
                    message: "Cannot receive 200 of 'Copper Busbar': ordered 100, already received 40."
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: business_rule_violated
                      message:
                        type: string
                        example: "Cannot receive 200 of 'Copper Busbar': ordered 100, already received 40."
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
      tags:
        - '15. Purchase orders'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: object
                  description: 'Received quantities keyed by purchase-order-item id.'
                  example:
                    11: 40
                  properties: {  }
                invoice_number:
                  type: string
                  description: 'optional The supplier invoice, if it arrived with the goods.'
                  example: INV-88213
                  nullable: true
              required:
                - items
    parameters:
      -
        in: path
        name: purchase_order_id
        description: 'The ID of the purchase order.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: purchase_order
        description: 'The purchase order id.'
        example: 4
        required: true
        schema:
          type: integer
