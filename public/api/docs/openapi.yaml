  '/api/v1/work-orders/{work_order_id}/materials':
    put:
      summary: 'Replace the material plan'
      operationId: replaceTheMaterialPlan
      description: "خامات أمر التصنيع — the whole table in one atomic request, never merged.\nA phone on a weak link cannot reliably sequence \"add line 4, delete line\n2, edit line 3\": one dropped request in the middle leaves the server\nholding a plan that never existed on either side. Sending the finished\ntable is a single decision that is safe to retry, and the\n`Idempotency-Key` makes the retry free.\n\nThis plan is what issue vouchers are validated against, so editing it\nchanges what the warehouse may issue without approval.\n\n`unit_cost` falls back to the item card when omitted."
      parameters: []
      responses:
        200:
          description: Replaced
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 31
                    type: work_order
                    materials:
                      -
                        item_id: 7
                        quantity: '40.0000'
                        unit_cost: '1000.00'
                        line_value: '40000.00'
                        is_manual: true
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 31
                      type:
                        type: string
                        example: work_order
                      materials:
                        type: array
                        example:
                          -
                            item_id: 7
                            quantity: '40.0000'
                            unit_cost: '1000.00'
                            line_value: '40000.00'
                            is_manual: true
                        items:
                          type: object
                          properties:
                            item_id:
                              type: integer
                              example: 7
                            quantity:
                              type: string
                              example: '40.0000'
                            unit_cost:
                              type: string
                              example: '1000.00'
                            line_value:
                              type: string
                              example: '40000.00'
                            is_manual:
                              type: boolean
                              example: true
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
      tags:
