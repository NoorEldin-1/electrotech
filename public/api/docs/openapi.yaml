        required: true
        schema:
          type: integer
  '/api/v1/work-orders/{work_order_id}/fetch-standard-materials':
    post:
      summary: 'Re-fetch the standard material plan'
      operationId: reFetchTheStandardMaterialPlan
      description: "Expands each finished product's approved **standard BOM**, scales it by\nthat product's planned quantity, merges shared raw materials into one\nline, and REPLACES the order's material table with the result.\n\nThis discards manual adjustments, which is the point of the action — it\nis \"start again from the recipe\". Refused when a product has no approved\nstandard BOM, naming the product, because a silently short plan would\nunder-issue the order."
