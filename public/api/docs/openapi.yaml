                type: object
                example:
                  data:
                    id: 3
                    type: bom
                    total_cost: '84250.00'
                    items:
                      -
                        id: 52
                        item_id: 7
                        quantity: '120.0000'
                        waste_percentage: '5.00'
                        total_required_quantity: '126.0000'
