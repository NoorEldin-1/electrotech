                      request_id:
                        type: string
                        example: 9f1c...
                      api_version:
                        type: string
                        example: '1'
      tags:
        - '5. Roles'
    patch:
      summary: 'Update a role'
      operationId: updateARole
      description: "`permissions` **replaces** the role's whole set — send the complete list,\nnot a delta. That mirrors the panel's checkbox grid, where saving writes\nwhatever is ticked."
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 9
                    type: role
                    name: Warehouse_Supervisor
                    guard_name: web
                    permissions:
                      - inventory.view
                  meta:
                    request_id: 9f1c...
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 9
                      type:
                        type: string
                        example: role
                      name:
                        type: string
                        example: Warehouse_Supervisor
                      guard_name:
                        type: string
                        example: web
                      permissions:
                        type: array
                        example:
                          - inventory.view
                        items:
                          type: string
