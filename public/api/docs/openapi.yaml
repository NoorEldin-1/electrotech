                        type: string
                        example: business_rule_violated
                      message:
                        type: string
                        example: 'Voucher RV-202609-0003 has no lines to post.'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
      tags:
        - '22. Return vouchers'
