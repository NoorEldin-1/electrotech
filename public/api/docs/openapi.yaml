      summary: 'Item stock card'
      operationId: itemStockCard
      description: "The valued movement history for one item in one warehouse (كارت الصنف):\nevery receipt and issue with its running quantity, weighted-average unit\ncost and balance value.\n\n`warehouse` defaults to the item's home warehouse. Reservations are\nexcluded — they change availability, not stock value — and scrap\nvariants are kept separate, because averaging two distinct items into one\npool would be accounting-incorrect.\n\nOn the **reports** rate limiter: it walks the item's whole movement\nhistory, so it is materially more expensive than a page of the ledger."
      parameters:
        -
          in: query
          name: warehouse
          description: "A warehouse_type value; defaults to the item's home warehouse."
          example: raw_materials
          required: false
          schema:
            type: string
            description: "A warehouse_type value; defaults to the item's home warehouse."
            example: raw_materials
