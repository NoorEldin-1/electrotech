                            example: 9f1c
                          api_version:
                            type: string
                            example: '1'
                  -
                    description: 'Nothing left to close'
                    type: object
                    example:
                      error:
                        code: business_rule_violated
                        message: 'Operation 2026-14 has nothing left to close.'
                      meta:
                        request_id: 9f1c
                        api_version: '1'
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            type: string
                            example: business_rule_violated
