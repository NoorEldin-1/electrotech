                    type: object
                    properties:
                      id:
                        type: integer
                        example: 7
                      type:
                        type: string
                        example: depreciation_voucher
                      status:
                        type: object
                        properties:
                          value:
                            type: string
                            example: posted
                          label:
                            type: string
                            example: Posted
                          color:
                            type: string
                            example: success
                      total_value:
                        type: string
