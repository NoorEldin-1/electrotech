  /api/v1/reports/income-statement:
    get:
      summary: 'Income statement'
      operationId: incomeStatement
      description: "قائمة الدخل — net sales, cost of sales, gross profit, then other revenue\nand expenses down to net profit. Every line carries the accounts behind\nit, so a reader can see what a figure is made of without a second call.\n\nNote how foreign-exchange differences are handled: one NET figure, routed\nto whichever side it fell on. It appears as `fx_gain` under revenues or\n`fx_loss` under expenses, never both — showing a gain and a loss for the\nsame period would double-count the same movement."
      parameters:
        -
          in: query
          name: from
          description: 'date Inclusive.'
          example: '2026-01-01'
          required: false
          schema:
            type: string
            description: 'date Inclusive.'
            example: '2026-01-01'
        -
          in: query
          name: to
          description: 'date Inclusive.'
          example: '2026-12-31'
          required: false
          schema:
            type: string
            description: 'date Inclusive.'
            example: '2026-12-31'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    net_sales:
                      sales: '2400000.00'
                      returns: '50000.00'
                      net: '2350000.00'
                    cost_of_sales: '1400000.00'
                    gross_profit: '950000.00'
                    revenues:
                      total: '20000.00'
                    expenses:
                      total: '310000.00'
                    net_profit: '660000.00'
                    from: '2026-01-01'
                    to: '2026-12-31'
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      net_sales:
                        type: object
                        properties:
                          sales:
                            type: string
                            example: '2400000.00'
                          returns:
                            type: string
                            example: '50000.00'
                          net:
                            type: string
                            example: '2350000.00'
                      cost_of_sales:
                        type: string
                        example: '1400000.00'
                      gross_profit:
                        type: string
                        example: '950000.00'
                      revenues:
                        type: object
                        properties:
                          total:
                            type: string
                            example: '20000.00'
                      expenses:
                        type: object
                        properties:
                          total:
                            type: string
                            example: '310000.00'
                      net_profit:
                        type: string
                        example: '660000.00'
                      from:
                        type: string
                        example: '2026-01-01'
                      to:
                        type: string
                        example: '2026-12-31'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
      tags:
        - '37. Reports'
  /api/v1/reports/balance-sheet:
    get:
      summary: 'Balance sheet'
      operationId: balanceSheet
      description: "الميزانية — fixed assets at cost / accumulated / net, working capital,\nand the funding that pays for it all.\n\nRead `balanced` first. The sheet is only trustworthy if total investment\nequals total funding; when it does not, `difference` says by how much,\nand that is a finding to chase rather than a rounding artefact to hide.\n\n`period_from` decides the window the period's profit is computed over,\nwhich is the figure carried inside equity. It defaults to the start of\n`as_of`'s year."
      parameters:
        -
          in: query
          name: as_of
          description: 'date The date the sheet is drawn at. Defaults to today.'
          example: '2026-12-31'
          required: false
          schema:
            type: string
            description: 'date The date the sheet is drawn at. Defaults to today.'
            example: '2026-12-31'
        -
          in: query
          name: period_from
          description: 'date Start of the period whose profit sits in equity. Defaults to the start of that year.'
          example: '2026-01-01'
          required: false
          schema:
            type: string
            description: 'date Start of the period whose profit sits in equity. Defaults to the start of that year.'
            example: '2026-01-01'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    as_of: '2026-12-31'
                    working_capital: '820000.00'
                    total_investment: '1960000.00'
                    funding:
                      total: '1960000.00'
                    balanced: true
                    difference: '0.00'
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      as_of:
                        type: string
                        example: '2026-12-31'
                      working_capital:
                        type: string
                        example: '820000.00'
                      total_investment:
                        type: string
                        example: '1960000.00'
                      funding:
                        type: object
                        properties:
                          total:
                            type: string
                            example: '1960000.00'
                      balanced:
                        type: boolean
                        example: true
                      difference:
                        type: string
                        example: '0.00'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
      tags:
        - '37. Reports'
  /api/v1/reports/cash-flow:
    get:
      summary: 'Cash flow statement'
      operationId: cashFlowStatement
      description: "قائمة التدفقات النقدية — net profit adjusted for non-cash items, then\nworking capital, investing and financing, down to the net change in cash.\n\nThe field to check is `reconciled`. The statement derives a closing cash\nfigure and compares it against the cash the ledger actually holds; when\nthe two disagree, `reconciliation_difference` says by how much. A cash\nflow statement that does not reconcile is not a presentation issue.\n\n`add_back_non_cash` reports which convention the platform is configured\nfor, so a reader knows whether depreciation was added back or netted."
      parameters:
        -
          in: query
          name: from
          description: "date Inclusive. Defaults to the start of `to`'s year."
          example: '2026-01-01'
          required: false
          schema:
            type: string
            description: "date Inclusive. Defaults to the start of `to`'s year."
            example: '2026-01-01'
        -
          in: query
          name: to
          description: 'date Inclusive. Defaults to today.'
          example: '2026-12-31'
          required: false
          schema:
            type: string
            description: 'date Inclusive. Defaults to today.'
            example: '2026-12-31'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    from: '2026-01-01'
                    to: '2026-12-31'
                    net_profit: '660000.00'
                    operating_cash: '720000.00'
                    net_change: '310000.00'
                    opening_cash: '200000.00'
                    derived_closing_cash: '510000.00'
                    actual_closing_cash: '510000.00'
                    reconciled: true
                    reconciliation_difference: '0.00'
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      from:
                        type: string
                        example: '2026-01-01'
                      to:
                        type: string
                        example: '2026-12-31'
                      net_profit:
                        type: string
                        example: '660000.00'
                      operating_cash:
                        type: string
                        example: '720000.00'
                      net_change:
                        type: string
                        example: '310000.00'
                      opening_cash:
                        type: string
                        example: '200000.00'
                      derived_closing_cash:
                        type: string
                        example: '510000.00'
                      actual_closing_cash:
                        type: string
                        example: '510000.00'
                      reconciled:
                        type: boolean
                        example: true
                      reconciliation_difference:
                        type: string
                        example: '0.00'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
      tags:
        - '37. Reports'
