                            example: draft
                          label:
                            type: string
                            example: Draft
                          color:
                            type: string
                            example: gray
                      lines_count:
                        type: integer
                        example: 10
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
