    post:
      summary: 'Create a draft addition voucher'
      operationId: createADraftAdditionVoucher
      description: "For goods arriving **without** a purchase order. Receiving against an\norder goes through `POST /purchase-orders/{id}/receive` instead, which\nbuilds and posts the voucher for you and enforces the ordered quantities.\n\n`voucher_number` is generated by the server. The lines are sent with the\nvoucher; nothing moves until it is posted.\n\nA registered `supplier_id` is optional — a receipt with no invoice and no\norder may carry only a free-text `supplier_name`. Note the consequence:\nwith no supplier record there is nobody to credit, so posting adds the\nstock and writes no ledger entry."
      parameters: []
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 16
                    type: addition_voucher
                    voucher_number: AV-202609-0032
                    status:
                      value: draft
                      label: Draft
                      color: gray
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 16
                      type:
                        type: string
                        example: addition_voucher
                      voucher_number:
                        type: string
                        example: AV-202609-0032
                      status:
                        type: object
                        properties:
                          value:
                            type: string
                            example: draft
                          label:
                            type: string
                            example: Draft
                          color:
                            type: string
                            example: gray
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
      tags:
        - '18. Addition vouchers'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                supplier_id:
                  type: integer
                  description: 'optional The supplier to credit on posting.'
                  example: 3
                  nullable: true
                supplier_name:
                  type: string
                  description: 'optional Free-text name when there is no supplier record.'
                  example: 'Walk-in supplier'
                  nullable: true
                voucher_date:
                  type: date
                  description: 'optional Defaults to today.'
                  example: '2026-09-08'
                  nullable: true
                invoice_number:
                  type: string
                  description: 'optional If the invoice arrived with the goods.'
                  example: INV-88213
                  nullable: true
                invoice_value:
                  type: number
                  description: 'optional The invoice total; falls back to the stock value when omitted.'
                  example: 40000.0
                  nullable: true
                notes:
                  type: string
                  description: optional
                  example: 'Received at the Cairo store'
                  nullable: true
                lines:
                  type: array
                  description: 'What arrived.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      item_id:
                        type: integer
                        description: ''
                        example: 7
                      quantity:
                        type: number
                        description: ''
                        example: 40.0
                      unit_cost:
