      operationId: postADepreciationVoucher
      description: "Deducts each positive line from the item's **work-in-progress** balance,\ncarries the value to a loss account with a balanced journal entry, and —\nfor abnormal loss only — reverses the value off the operation.\n\nRefused if every line is still at zero: there would be nothing to write\noff, and a \"posted\" voucher recording no loss is worse than no voucher.\nAlso refused if the WIP balance is short, which usually means the\nmaterials were never issued to the order in the first place.\n\nGated by `depreciation_vouchers.post`, separately from `create`."
      parameters: []
      responses:
        200:
          description: Posted
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 7
                    type: depreciation_voucher
                    status:
                      value: posted
                      label: Posted
                      color: success
                    total_value: '3000.00'
                    journal_entry_id: 42
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
