      description: "The moment everything happens: each line is added to its warehouse, the\nsupplier is credited, and a linked purchase order has its received\nquantities updated and its status re-derived. All in one transaction.\n\nGated by `addition_vouchers.post`, which is not\n`addition_vouchers.create` — raising a receipt and committing it to the\nstock ledger and the supplier's account are different acts.\n\nPosting twice is refused, not ignored. That is what makes double-posting\nimpossible even if the `Idempotency-Key` is fumbled."
      parameters: []
      responses:
        200:
          description: Posted
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 16
                    type: addition_voucher
                    status:
                      value: posted
                      label: Posted
                      color: success
                    posted_at: '2026-09-08T12:45:00+00:00'
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 16
                      type:
                        type: string
                        example: addition_voucher
                      status:
                        type: object
                        properties:
                          value:
                            type: string
                            example: posted
                          label:
                            type: string
                            example: Posted
                          color:
                            type: string
                            example: success
                      posted_at:
                        type: string
                        example: '2026-09-08T12:45:00+00:00'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
