  /api/v1/auth/login:
    post:
      summary: 'Sign in'
      operationId: signIn
      description: "Exchanges credentials for a bearer token. The plain-text token is\nreturned **once and only once** — store it in secure storage\n(`flutter_secure_storage`), never in shared preferences.\n\nThrottled to 5 attempts per minute per email+IP."
