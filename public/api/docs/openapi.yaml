  '/api/v1/work-orders/{work_order_id}/material-requirement':
    get:
      summary: 'What the order still needs'
      operationId: whatTheOrderStillNeeds
      description: "Per item: what the plan requires, what previous vouchers already issued\n(net of posted returns), and what is left. This is exactly the\ncalculation an issue voucher is validated against, so a client can show\nthe store keeper what a voucher may carry before it is written rather\nthan after it is refused.\n\nDrafts on other vouchers are counted as already issued. That is right\nfor a suggestion — two store keepers should not each prepare a voucher\nfor the same remaining material — and deliberately different from the\nposting gate, where only stock that has actually left the store counts."
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      item_id: 7
                      item_name: 'Copper busbar 120mm'
                      required: '40.0000'
                      previously_issued: '25.0000'
                      remaining: '15.0000'
                      unit_cost: '1000.00'
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  data:
                    type: array
                    example:
