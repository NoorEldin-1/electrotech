    get:
      summary: 'Show a role'
      operationId: showARole
      description: 'Always includes the full permission list attached to the role.'
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 2
                    type: role
