    post:
      summary: 'Mark one as read'
      operationId: markOneAsRead
      description: "Scoped to your own notifications: another user's id is a **404**, not a\n403. Answering \"forbidden\" would confirm that the notification exists,\nwhich is more than a caller who cannot read it should learn.\n\nMarking an already-read notification is a silent success."
