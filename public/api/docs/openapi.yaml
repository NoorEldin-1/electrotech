      responses:
        200:
          description: Posted
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 9
                    type: return_voucher
                    status:
                      value: posted
                      label: Posted
                      color: success
                    total_value: '2000.00'
                    signed_at: '2026-09-12T11:00:00+00:00'
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
