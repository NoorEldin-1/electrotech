      summary: 'Delete an item'
      operationId: deleteAnItem
      description: "A soft delete: the row stays so historical vouchers and BOM lines keep\nresolving their item name. An item that still has stock on hand is\nrefused, because deleting it would strand a balance with nothing left to\nreport it against."
