  '/api/v1/issue-vouchers/{issue_voucher_id}/post':
    post:
      summary: 'Post an issue voucher'
      operationId: postAnIssueVoucher
      description: "The moment the material leaves the store. Every line is transferred from\nraw materials into work-in-progress, the total is loaded onto the\noperation (the project is the cost centre) and accrued onto the work\norder, and the voucher is signed — all in one transaction.\n\n**The excess flow.** Before any stock moves, the voucher is compared\nagainst what the order still needs. If it goes over, the response is\n`422 issue_excess_requires_approval` with the offending rows in\n`details.excess` — item by item: what was required, what was already\nissued, what is left, what this voucher asks for, and the overage. Show\nthose rows. If the user holds `issue_vouchers.approve_excess`, offer to\nretry with `allow_excess: true` and a reason; otherwise the only way\nforward is to edit the lines down.\n\nPosting twice is refused, not ignored — which is what makes\ndouble-posting impossible even if the `Idempotency-Key` is fumbled."
      parameters: []
      responses:
        200:
          description: Posted
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 48
                    type: issue_voucher
                    status:
                      value: posted
                      label: Posted
                      color: success
                    total_value: '15000.00'
                    signed_at: '2026-09-12T09:15:00+00:00'
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 48
                      type:
                        type: string
                        example: issue_voucher
                      status:
                        type: object
                        properties:
                          value:
