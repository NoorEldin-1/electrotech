            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'optional New unique role name.'
                  example: Warehouse_Supervisor
                permissions:
                  type: array
                  description: 'optional The complete replacement permission set.'
                  example:
                    - inventory.view
                  items:
                    type: string
    delete:
      summary: 'Delete a role'
      operationId: deleteARole
      description: "RolePolicy refuses to delete the Admin role, so that always returns 403.\nUsers who held the deleted role lose its permissions immediately; a user\nleft with no role at all can no longer sign in."
