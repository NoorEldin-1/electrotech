      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                materials:
                  type: array
                  description: 'The complete list. Send `[]` to clear it.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      item_id:
                        type: integer
                        description: ''
                        example: 7
                      quantity:
                        type: number
                        description: 'May be zero to keep a deliberately-excluded line on the table.'
                        example: 40.0
