                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
      tags:
        - '7. Items'
    patch:
      summary: 'Update an item'
      operationId: updateAnItem
      description: "Send only the fields to change. `type` is editable, but changing it also\nchanges the item's home warehouse while existing stock rows stay where\nthey are, so only do it for an item with no movements yet."
      parameters: []
