  '/api/v1/offers/{offer_id}/boq':
    put:
      summary: 'Replace the BOQ'
      operationId: replaceTheBOQ
      description: "Sends the whole bill of quantities in one request: a list of groups (the\npriced tables — \"Copper Offer\", \"Bi-Metal Offer\") each holding its line\nitems. Whatever was there before is replaced.\n\n**Replace, not merge, and deliberately so.** A phone editing a BOQ over a\nweak link cannot reliably sequence \"add line 4, delete line 2, edit line\n3\": a dropped request in the middle leaves the server holding a document\nthat never existed on either side. Sending the finished table is one\natomic decision the client can retry safely, and the `Idempotency-Key`\nmakes the retry free.\n\nLine totals, group subtotals, VAT, installation and the grand total are\nall computed server-side and returned."
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 4
                    type: offer
                    subtotal: '1250000.40'
                    tax_amount: '175000.06'
                    grand_total: '1425000.46'
                    groups:
                      -
                        id: 9
                        label: 'Copper Offer'
                        subtotal: '1250000.40'
                        items:
                          -
                            id: 31
                            description: 'Busbar trunking 2500A'
                            quantity: '120.0000'
                            unit_price: '10416.67'
                            line_total: '1250000.40'
                  meta:
                    request_id: 9f1c
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 4
                      type:
                        type: string
                        example: offer
                      subtotal:
                        type: string
                        example: '1250000.40'
                      tax_amount:
                        type: string
                        example: '175000.06'
                      grand_total:
                        type: string
                        example: '1425000.46'
                      groups:
                        type: array
                        example:
                          -
                            id: 9
                            label: 'Copper Offer'
                            subtotal: '1250000.40'
                            items:
                              -
                                id: 31
                                description: 'Busbar trunking 2500A'
                                quantity: '120.0000'
                                unit_price: '10416.67'
                                line_total: '1250000.40'
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 9
                            label:
                              type: string
                              example: 'Copper Offer'
                            subtotal:
                              type: string
                              example: '1250000.40'
                            items:
                              type: array
                              example:
                                -
                                  id: 31
                                  description: 'Busbar trunking 2500A'
                                  quantity: '120.0000'
                                  unit_price: '10416.67'
                                  line_total: '1250000.40'
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    example: 31
                                  description:
                                    type: string
                                    example: 'Busbar trunking 2500A'
                                  quantity:
                                    type: string
                                    example: '120.0000'
                                  unit_price:
                                    type: string
                                    example: '10416.67'
                                  line_total:
                                    type: string
                                    example: '1250000.40'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        example: 9f1c
                      api_version:
                        type: string
                        example: '1'
      tags:
        - '13. Offers & BOQ'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groups:
                  type: array
                  description: 'The priced tables. Send an empty array to clear the BOQ.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                        description: 'Table heading.'
                        example: 'Copper Offer'
                      conductor_type:
                        type: string
                        description: 'optional One of the conductor_type enum values.'
                        example: copper
                        nullable: true
                      items:
                        type: array
                        description: 'The lines of this table.'
                        example:
                          - []
                        items:
                          type: object
                          properties:
                            description:
                              type: string
                              description: ''
                              example: 'Busbar trunking 2500A'
                            unit:
                              type: string
                              description: optional
                              example: m
                              nullable: true
                            quantity:
                              type: number
                              description: ''
                              example: 120.0
                            unit_price:
                              type: number
                              description: 'Price per unit in EGP.'
                              example: 10416.67
                          required:
