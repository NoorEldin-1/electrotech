                    guard_name: web
                    users_count: 4
                    permissions:
                      - projects.view
                      - projects.create
                  meta:
                    request_id: 9f1c...
                    api_version: '1'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
