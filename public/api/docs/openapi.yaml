                    warehouse:
                      value: raw_materials
                      label: 'Raw Materials'
                      color: null
                    item:
                      id: 7
                      name: 'Copper Busbar'
                      sku: CU-BB-1
                    rows:
                      -
                        id: 91
                        date: '2026-09-01T09:00:00+00:00'
                        reference: 'Addition voucher AV-202609-0031'
                        in_qty: '40.0000'
                        in_price: '1000.00'
