openapi: 3.0.3
info:
  title: 'Electrotech API — توثيق واجهات النظام'
  description: 'REST API for the Electrotech ERP platform: sales pipeline, technical office, procurement, warehouse, manufacturing, delivery and accounting.'
  version: 1.0.0
servers:
  -
    url: 'https://app.electrotech.findosystem.com'
tags:
  -
    name: '0. Meta'
    description: "\nService discovery and shared vocabulary. Call these once at app start; the\npayloads change only when the platform is redeployed."
  -
    name: '1. Authentication'
    description: "\nSign in, sign out and token rotation.\n\nEvery other endpoint in this API requires a bearer token obtained here:\n\n    Authorization: Bearer 12|xxxxxxxxxxxxxxxx\n    Accept: application/json"
  -
    name: '2. Profile'
    description: "\nThe signed-in user's own account: who am I, edit my details, change my\npassword. Managing *other* users lives under \"Users\" and is permission-gated."
  -
    name: '3. Devices'
    description: "\nThe caller's own active sign-in sessions. Every login creates one; this is\nhow a user reviews them and signs a lost device out.\n\nStrictly self-scoped: there is no endpoint here to inspect or revoke another\nuser's sessions. An administrator who needs to lock an account out disables\nthe user through the Users endpoints instead."
  -
    name: '4. Users'
    description: "\nAdministration of user accounts. Every endpoint is gated by the same\n`users.*` permissions and the same UserPolicy the admin panel uses — the API\nintroduces no parallel authorization."
  -
    name: '5. Roles'
    description: "\nRoles and their attached permissions. Gated by `roles.manage` through the\nexisting RolePolicy — the same gate the panel's Roles screen uses.\n\nThe Admin role is protected: RolePolicy refuses to delete it, and the\ndeploy-time seeder force-syncs it to every permission in the catalog. Do not\ntry to trim it through this API; the next deploy would undo it."
  -
    name: '6. Permissions'
    description: "\nThe read-only permission catalog, grouped exactly as the panel's Roles\nscreen groups it. A Flutter role-editing screen renders this directly.\n\nPermissions are defined in code (RoleAndPermissionSeeder) and synced on\nevery deploy, so there is deliberately no create/update/delete here — a\npermission invented at runtime would be one nothing ever checks."
  -
    name: '7. Items'
    description: "\nThe material catalogue (الأصناف): raw materials, semi-finished parts,\nfinished goods and consumables. Every BOM line, purchase-order line, voucher\nline and stock balance in the platform points at one of these, so this is\nusually the first list a client caches after logging in."
  -
    name: '8. Customers'
    description: "\nThe customer file (العملاء). A customer owns projects and delivery\nvouchers, and carries a running ledger balance built from the account\nentries those documents post."
  -
    name: '9. Suppliers'
    description: "\nThe supplier file (الموردين). A supplier owns purchase orders and addition\nvouchers, and carries a running ledger balance from the account entries\nthose documents post."
  -
    name: '10. Attachments'
    description: "\nDocuments attached to a record: the drawings and BOQ on a project, the\ncommercial registry and tax card on a supplier, the scanned purchase order,\nthe goods-receipt note on an addition voucher.\n\nOne endpoint serves all of them. The caller names the owner with\n`owner_type` + `owner_id`, where `owner_type` is one of a fixed set of keys\n(`project`, `customer`, `supplier`, `purchase_order`, `addition_voucher`) —\nnever a PHP class name. See App\\Http\\Api\\AttachmentOwner for why that\ndistinction is load-bearing.\n\n**Authorization has no permissions of its own.** Attaching a file to a\nsupplier is an edit of that supplier and reading one is a view of it, so the\nowner's existing policy answers both. That is deliberate: a separate\n`attachments.*` permission would start out matching the panel and drift the\nfirst time somebody changed one and not the other."
  -
    name: '11. Operations'
    description: "\nOperations (العمليات) are the spine of the platform: a tender becomes an\nin-hand job, becomes an active operation, and everything downstream — BOMs,\npurchase orders, work orders, delivery vouchers, the cost centre — hangs off\none of these rows.\n\nThis controller covers the record itself. The pipeline transitions between\nstatuses live in PipelineController, because they are state-machine moves\nwith their own pre-conditions and their own permissions, not field edits."
  -
    name: '12. Sales pipeline'
    description: "\nMoving an operation between stages:\n\n    Draft → Tender → In Hand → In Progress (active operation)\n                          ↓\n                        Lost\n\nThese are separate endpoints rather than a `status` field on PATCH for two\nreasons. Each move has its own permission (`projects.move_to_active` is not\n`projects.edit`), and each has pre-conditions the caller cannot see —\nmoving to Active needs both the consultant's acceptance email and the\nmanager's approval on file.\n\nEvery rule here lives in App\\Services\\SalesPipelineService, which the\nFilament panel calls too. A pre-condition failure arrives as\n**422 `business_rule_violated`** with a message written for a person: show\nit to the user directly rather than mapping it."
  -
    name: '13. Offers & BOQ'
    description: "\nThe quotations submitted for an operation, and the bill of quantities behind\neach one.\n\n**The money is derived, never posted.** A client sends line items —\ndescription, unit, quantity, unit price — and the server multiplies, sums,\napplies VAT and installation, and returns the totals. Accepting a\n`grand_total` from the client would mean the printed offer, the pipeline\nlist and the ledger could each hold a different number for the same\nquotation."
  -
    name: '14. Bills of materials'
    description: "\nThe Technical Office's output (قائمة المواد): what a job, or a product, is\nmade of.\n\nA BOM is either **project-scoped** (this operation needs these materials) or\n**standard** (`output_item_id` set — the fixed recipe for building this\nproduct, تركيبة المنتج القياسية). Both live here; `scope` tells them apart.\n\nThe state machine is Draft → Pending approval → Approved, and approving\nsupersedes the previously approved version of the same subject. That matters\ndownstream: stock reservations and a work order's material plan both read\n\"the latest approved BOM\", so leaving two approved would make which recipe a\njob used depend on a tiebreak rather than a decision."
  -
    name: '15. Purchase orders'
    description: "\nBuying (أوامر الشراء): Draft → Submitted → Partially received → Received.\n\nTwo things about this module surprise people reading it for the first time.\n\n**The money is derived.** `subtotal`, `vat_amount`, `profit_tax_amount` and\n`total_amount` are all computed from the line items and the configured\nrates; the client sends quantities and unit prices only. And the total is\n`subtotal + VAT − profit tax` — the 1% profit-tax withholding is deducted,\nand skipped entirely for an exempt supplier.\n\n**Receiving does not touch stock directly.** It raises an addition voucher\n(إذن إضافة), the single goods-receipt document, and posts it. That voucher\nadds the stock once, credits the supplier, and closes the order by comparing\nordered against received. Adding stock here as well would double-count every\ndelivery."
  -
    name: '16. Stock reservations'
    description: "\nHolding stock for an operation (حجز الكمية للعملية).\n\nA reservation lowers an item's **available** quantity without moving\nanything physically, so the same material cannot be promised to two jobs.\nReleasing it hands the quantity back — normally when the materials are\nactually issued to manufacturing.\n\nReserving more than is available is refused by InventoryService, and arrives\nas `422 business_rule_violated` naming the item, the warehouse, and the\nquantity that was actually free."
  -
    name: '17. Inventory'
    description: "\nWhat is in the warehouses, how it got there, and what it is worth.\n\nEverything here is **read-only**. Stock is never moved by writing to a\nbalance: it moves because a document was posted — an addition voucher, an\nissue voucher, a reservation. Exposing a writable balance would let a client\nput the ledger and the on-hand figure out of step with nothing to reconcile\nthem against, which is the one failure an inventory system cannot recover\nfrom."
  -
    name: '18. Addition vouchers'
    description: "\nGoods receipt (إذن إضافة). This is the **only** document that adds purchased\nstock, which is why receiving against a purchase order produces one rather\nthan touching the balance directly.\n\nThe lifecycle is Draft → Posted, and posting is the moment everything\nhappens at once: the stock is added, the supplier is credited, and any linked\npurchase order has its received quantities updated and its status re-derived.\nA posted voucher is immutable — the correction for a mistake is a separate\ndocument, not an edit, because the stock and the ledger have already moved.\n\nAfter posting, the **invoicing** state takes over: `not_invoiced` until the\nsupplier's invoice arrives, then `invoiced`, or `closed_uninvoiced` when it\nis decided the invoice never will. That field is derived on every save —\nrecord an invoice or close the voucher to change it, never write it."
  -
    name: '19. Depreciation vouchers'
    description: "\nWriting off manufacturing loss (إذن إهلاك): material that went into\nwork-in-progress and did not come out as product.\n\nThe flow is deliberately two-step. Creating one against a work order builds\na **draft pre-filled with everything that was issued to that order, all at\nquantity zero** — the user then sets quantities only for what was actually\nlost and leaves the rest alone. Lines still at zero are ignored when it\nposts.\n\nPosting takes the loss out of the WIP balance (lowering the item's quantity\nand value on its stock card) and writes a balanced journal entry carrying\nthe value to a loss account. `loss_type` decides the operation-cost\ntreatment — see DepreciationVoucherResource.\n\nA work order is required, which is why this document sits at the boundary\nwith the manufacturing module. Only the reference is needed here; the work\norder's own endpoints arrive in Module 7."
  -
    name: '20. Manufacturing orders'
    description: "\nأمر التصنيع — the document the factory works from.\n\nThe lifecycle is a chain of gates, each with its own permission, and none of\nthem is a `status` you can PATCH:\n\n  Draft → **approve-order** (PMO manager) → Pending\n        → **start** → InProgress\n        → **submit-qa** (declare what was made) → QaReview\n        → **approve-qa** (QA sign-off)\n        → **finish-manufacturing** (needs BOTH approvals; opens the quality\n          sheet and tells every department the product is ready)\n        → **complete** (produces stock, consumes WIP, writes the loss record)\n\nTwo gates are worth knowing before you build a screen. `approve-order` and\n`start` both refuse an order with no positive planned quantity or no\nplanned dates — the plan is what variance, efficiency and loss are measured\nagainst, and a zero plan silently zeroes all three. And\n`finish-manufacturing` refuses unless the PMO approval **and** the QA\napproval are both already on the record; `approvals.can_finish_manufacturing`\non the resource answers the same question, so hide the action rather than\nlet the user discover the refusal.\n\nMaterials and products are each written with a single PUT carrying the whole\nlist. See `replaceMaterials` for why."
  -
    name: '21. Issue vouchers'
    description: "\nإذن صرف — material leaving the raw store for a work order.\n\nA voucher is always raised **against a work order**, and the server\npre-fills it with what that order still needs: its material plan, minus what\nother vouchers already carry, net of posted returns. The warehouse then\nedits the list and posts it. Posting transfers every line from raw materials\ninto work-in-progress and loads the value onto the operation.\n\nThe rule that shapes this whole module is the **excess gate**. A voucher\nthat would take the order past its plan is refused with\n`422 issue_excess_requires_approval`, carrying the offending rows in\n`details.excess`. Going over is allowed — a broken part has to be replaced —\nbut only as a decision: a user holding `issue_vouchers.approve_excess`\nretries with `allow_excess` and a written reason, and both are stamped on\nthe document.\n\nOnly POSTED vouchers count as already-issued at that gate. A sibling draft\nhas not moved anything, so it cannot make a voucher \"excess\". Drafts *are*\ncounted when suggesting lines, so two store keepers do not each prepare a\nvoucher for the same remaining material."
  -
    name: '22. Return vouchers'
    description: "\nإذن ارتداد — unconsumed material going back from the floor to the store.\n\nThe exact inverse of an issue voucher: posting transfers each line out of\nwork-in-progress and back into the SAME item's raw stock, and reverses its\nvalue off the operation and the work order. The material re-enters under its\nown code (there is no separate scrap item), so it can simply be issued\nagain.\n\nA draft is pre-filled with one line per material the order was issued, each\nat **quantity zero**, and the warehouse raises only the lines that actually\ncame back. Posting ignores the zeros. That is why the write endpoint allows\na zero quantity where an issue voucher would not: deleting a hundred lines\nto return two is not a workflow anyone completes correctly on a tablet.\n\nScrap items are left out of the pre-fill — scrap does not go back into raw\nstock."
  -
    name: '23. Quality sheets'
    description: "\nورقة الجودة — the test record and the certificate printed from it.\n\nA draft sheet is opened **automatically** when a work order's manufacturing\nis declared finished, seeded with ten blank test rows and a snapshot of the\norder's technical specification. `POST /work-orders/{id}/quality-sheet` is\nidempotent and returns the existing sheet rather than a second one, so a\nclient may call it freely.\n\nLifecycle: Draft → **fill** (QA signs the readings) → **approve** (the\nfactory manager's final sign-off, which announces to every department that\nthe operation has finished manufacturing). Approval is final: an approved\nsheet can no longer be edited, which is what makes the printed certificate\nworth anything.\n\nReadings are written with `PUT /quality-sheets/{id}/lines`, separately from\nthe signature, so an inspector can save a partly-filled grid all afternoon\nand sign once."
  -
    name: '24. Production entries'
    description: "\nالإنتاج والفاقد — what a completed work order actually produced, and what it\nlost doing so. One row per finished product per completed order.\n\n**Read-only, deliberately.** `ProductionEntryPolicy` answers false to\ncreate, update and delete, and this controller has no write endpoints to\nmatch. These rows are written by the work order's `complete` transition, at\nthe same moment the stock moves. A writable production entry would let the\nloss figures be edited away from the movements that produced them, with\nnothing left to reconcile against.\n\n`costs.loss_value` is the money the scrap cost — scrap × the actual cost per\nproduced unit — not the quantity. It is the figure the value-based loss\nreport aggregates, which is why it is published here rather than left to\neach client to re-derive."
  -
    name: '25. Delivery vouchers'
    description: "\nإذن تسليم — finished goods leaving the store for a customer.\n\nThe document turns on a **dual signature**: technical management and\nfinancial management sign independently, in either order, through two\nseparate endpoints carrying two separate permissions. Neither is a field.\n\nThe second signature to arrive **activates** the voucher, and activation is\nthe moment everything happens at once, in one transaction: the finished\ngoods are deducted from stock, the customer's account is debited with the\ndelivered value, and — when no work order is still open on the operation —\nits cost centre is closed into cost of goods sold.\n\nThat is why the signature and the activation are atomic. If activation fails\n(insufficient finished goods, say), the signature must not survive it;\notherwise the voucher would show an approval that never took effect while\nthe user was told it failed.\n\nCost-centre closing is deliberately silent and deliberately last: a missing\naccount or an early delivery must never roll back a delivery that physically\nhappened. Finance can always close the centre by hand afterwards."
  -
    name: '26. Delivery minutes'
    description: "\nمحضر التسليم — the record that a delivery was handed over, and the document\ncirculated to every department afterwards.\n\nA minute is always raised **from a delivery voucher** and inherits that\nvoucher's operation and customer. Sending them separately would allow a\nminute naming a different customer from the delivery it records — a\ncontradiction nobody could resolve months later.\n\n`distribute` is the one state it has, and it is one-way and idempotent:\ncalling it twice does not send a second round of notifications. After\ndistribution the minute freezes, because every department is already\nholding the copy that went out."
  -
    name: '27. Installations'
    description: "\nمرحلة التركيب — installing what was delivered, on the customer's site.\n\nPending → **start** → In Progress → **complete** → Completed. Each\ntransition stamps its own timestamp, which is why there is no writable\n`status`: a status a client can set is a status that drifts from the times\nbeside it.\n\nInstallation **expenses** are not modelled here. They reach the operation\nthrough the general ledger, tagged to it like every other cost, so that the\noperation's cost file has one source rather than a parallel field only this\nscreen knows about."
  -
    name: '28. Site surveys'
    description: "\nمعاينة الموقع — the visit that precedes an installation.\n\nThe one thing worth knowing: `measurements` is free text, not a structured\nfield. What a surveyor needs to write down differs by site and by product,\nand a schema that fitted the last ten sites would silently lose the\neleventh. Attach photographs through the generic attachments endpoint with\n`owner_type=project`."
  -
    name: '29. Chart of accounts'
    description: "\nدليل الحسابات — the accounts every journal line points at.\n\nTwo fields on an account decide how the rest of the platform reads it.\n`type` fixes its natural side, published as `natural_sign`: multiply that by\n(debit − credit) and you get a balance the right way up, which is what stops\na client showing every liability as a negative number.\n`statement_section` is the axis the financial statements are built on — an\naccount without one still posts and still appears in the trial balance, but\nlands nowhere on the income statement or the balance sheet.\n\nThe detail endpoint carries the account's **balance**; the list does not.\nWorking a balance out means walking the account's posted lines, so a page of\ntwo hundred accounts would pay for two hundred walks."
  -
    name: '30. Journal entries'
    description: "\nقيود اليومية — the general ledger's only source of movement.\n\nAn entry is written as **two columns**, مدين and دائن, rather than as rows\neach carrying a direction. The side a line is written on IS its direction,\nwhich removes a whole class of mistake: a row cannot end up on the wrong\nside because someone mistyped a field. The read shape gives you both — the\nflat `lines` and the split `debit_lines` / `credit_lines`.\n\nDraft → **post**. Posting enforces double entry: at least two lines, and\ntotal debits equal to total credits. A posted entry is then **immutable** —\nno edit, no delete, no re-post — because its numbers have already reached\nthe trial balance and every statement built on it. The correction for a\nmistake is a reversing entry.\n\nNumbering is threefold and all of it is the server's: `entry_serial` is the\ncontinuous sequence an auditor follows, `document_number` the per-type\nsequence (أمر صرف / إيصال توريد / قيد تسوية), and `entry_number` the\nhuman-readable reference."
  -
    name: '31. Sales invoices'
    description: "\nفواتير المبيعات — invoicing what was delivered.\n\nAn invoice is always raised **against a delivery voucher that is active**,\nwhich is to say against goods that actually left the store. Its customer is\ntaken from that voucher rather than sent, so an invoice can never name\nsomeone other than whoever received the goods.\n\nA voucher may be invoiced in instalments, but the instalments may not add up\nto more than was delivered. That single rule is what keeps \"delivered\" and\n\"invoiced\" reconcilable, and it is what drives the voucher's own\n`invoicing.status`, which is **re-derived** on every change — record an\ninvoice or delete one to move it, never write the field."
  -
    name: '32. Operation payments'
    description: "\nالدفعات والمقبوضات — cash moving in or out against an operation.\n\nRecording a payment can do three things at once, depending on configuration\nand on what the payload carries:\n\n 1. it writes the payment;\n 2. when automatic journalling is on and both accounts resolve, it writes\n    **and posts** a balanced journal entry, linking it back;\n 3. when the payment names a financial claim, it allocates to it, and the\n    claim collects itself once it is fully paid.\n\nStep 2 is what freezes the payment. Once `journal_entry_id` is set the\npolicy refuses edits and deletes: the money is in the ledger, and the\ncorrection for a posted entry is another entry, not a quiet edit of the\nfirst."
  -
    name: '33. Party statements'
    description: "\nكشف حساب — what a customer or a supplier owes, and why.\n\nEntirely **read-only**, and not by omission: `AccountEntryPolicy` refuses\ncreate, update and delete, and there are no write routes to match. These\nrows are written by documents — posting an addition voucher credits its\nsupplier, activating a delivery voucher debits its customer. An editable\nstatement could be brought into line with a balance somebody expected,\nrather than with the documents that produced it.\n\nThe two shapes here answer different questions. The **statement** endpoints\ngive one party's movements in order with a running balance, which is the\ndocument you print and send. The flat **index** is for searching across\nparties — it carries no running balance, because on a filtered or re-sorted\nlist that number would change depending on how you looked at it."
  -
    name: '34. Financial claims'
    description: "\nالمطالبات المالية — what the company is asking a customer to pay, for a\ngiven operation.\n\nDraft → **submit** → Submitted → **collect** → Collected. Three permissions,\nbecause raising a claim, sending it to the customer and declaring it paid\nare three different acts by three different people.\n\nSubmission is gated on the work being deliverable: the operation is\nCompleted, or at least one delivery to the customer is active. Claiming for\nwork that has not been delivered is how a receivable becomes a dispute.\n\nA claim also **collects itself** when payments allocated to it add up to its\namount, which is why `collect` is normally only called by hand for cash that\narrived outside the platform."
  -
    name: '35. Credit facilities'
    description: "\nالتسهيلات الائتمانية — a credit line, and how much of it is already\ncommitted to operations.\n\nThe rule the whole resource exists for: **a facility cannot be promised\ntwice.** An allocation is refused when it would take the committed total\npast the limit, so read `utilization.available` on the detail endpoint and\nshow it before anyone types an amount — it is cheaper to stop a user than to\nrefuse them.\n\nReleasing an allocation gives the room back. Nothing here touches the\nledger: a facility is a commitment, not a movement."
  -
    name: '36. Cost-centre closing'
    description: "\nإقفال مركز التكلفة — carrying an operation's accumulated cost out of\ninventory and into cost of goods sold, once its goods have reached the\ncustomer.\n\nThere are two paths in, and they behave differently on purpose. The\n**automatic** one fires when a delivery voucher activates: it is silent, it\nnever fires while a work order is still open on the operation (cost would be\ncharged to sales before it finished accruing), and it never throws — a\nmissing account must not roll back a delivery that physically happened.\n\nThe **manual** one is this endpoint, and every refusal it makes is explicit,\nso the user learns why nothing was posted rather than wondering: no active\ndelivery, nothing left to close, or the chart missing the COGS or inventory\naccount the entry needs.\n\nUndoing a closing is a **reversal**, never a deletion. The journal entry\nbehind it is posted and immutable, so the reversal writes a mirror-image\nentry plus a negative closing row; the unclosed balance comes back on its\nown and the audit trail stays whole."
  -
    name: '37. Reports'
    description: "\nThe financial reports, and the two views of an operation that summarize\neverything else: what it cost, and how far along it is.\n\nThree things are true of every endpoint here and are not repeated below.\n\n**They are on the reports rate limiter**, which is much tighter than the\nread limiter. Each one walks the ledger — the trial balance walks every\nactive account's whole posted history — so they are meant to be fetched on\ndemand and cached by the client, never polled.\n\n**Every money figure is a decimal string**, at two places. A JSON number is\na binary double in Dart, and a statement re-summed on the client would drift\nfrom the one the ledger holds (API_Development_Plan.md §3.10). Accounts\ninside a report appear as `{id, code, name, type}`, never as full records.\n\n**Each carries its own permission**, matching the panel's: `trial_balance.view`,\n`general_ledger.view`, `journal_daybook.view`, `income_statement.view`,\n`balance_sheet.view`, `cash_flow_statement.view`, `operating_statement.view`.\nSeeing what an operation cost and seeing the company's balance sheet are\ndifferent privileges and stay that way.\n\nDates are inclusive on both ends. An end before its start is a 422 rather\nthan an empty report, because an empty report looks like a true answer."
  -
    name: '38. Printable documents'
    description: "\nThe printable PDFs — an offer, a purchase order, a quality certificate, the\ndaybook, the ledger, the financial statements, a work order's material\nvariance.\n\nEvery endpoint here **streams `application/pdf`, not the JSON envelope.**\nThat is the one place in the API where the response is not an envelope, and\nit is deliberate: a client that wants a document wants the bytes to hand to\nthe platform's viewer or share sheet, not a base64 blob inside JSON that it\nwould have to decode and write to a file first.\n\nThese delegate to the **same controllers the admin panel prints through**,\nso the paper coming out of a phone is byte-for-byte the paper coming out of\na desktop. Re-implementing the layouts here would guarantee the two drift,\nand the printed offer a customer holds is not a thing to let drift.\n\nEach document keeps its own print permission (`project_offers.print`,\n`purchase_orders.print`, `quality_sheets.print`, and the report permissions\nfor the finance documents), enforced inside the shared controller. Being\nable to read a record through the API is not the same as being able to print\nit.\n\n**Language**: pass `?lang=ar` or `?lang=en` to choose the document's\nlanguage independently of the caller's UI locale — the customer's copy of an\noffer is not always in the language of whoever pressed print. An unknown or\nmissing value falls back to each document's own default.\n\nThey sit on the reports rate limiter: rendering a PDF is the most expensive\nthing the API does."
  -
    name: '39. Dashboard'
    description: "\nThe five counts the platform opens on: active operations, deliveries waiting\nfor a signature, purchase orders out with suppliers, orders on the shop\nfloor, and items below their minimum.\n\nThese read the **same cache keys the admin panel's own dashboard reads** —\n`dashboard:active_projects` and its four siblings — rather than recomputing\nthe numbers. Two consequences worth knowing:\n\n - a phone and a desktop opened side by side show the same figures, because\n   they are the same figures, not two independent counts that happen to\n   agree most of the time;\n - the numbers are invalidated by the model observers the moment the\n   underlying state changes, with a five-minute ceiling as a safety net in\n   case a write ever bypasses model events.\n\n`low_stock` is the expensive one — it aggregates availability per item\nacross every warehouse — which is why the whole endpoint sits on the reports\nrate limiter rather than the read one."
  -
    name: '40. Notifications'
    description: "\nWhat the platform has told **you**: a manufacturing order finished, a\nquality sheet approved, a delivery minute circulated.\n\nEvery endpoint here is **self-scoped** and carries no permission. That is\ndeliberate and it is the safest possible rule: a notification is addressed\nto one user, so the only question is whether you are that user. There is no\n\"read someone else's notifications\" endpoint to get the authorization wrong\non.\n\nThese are the same rows the admin panel's bell shows, so marking one read on\na phone clears it on the desktop.\n\nThe body of a notification is the panel's own payload — `title`, `body`,\n`icon`, `color`, `actions`. It is passed through as `data` rather than\nreshaped, because the panel's notification format is what every producer in\nthe platform already writes, and translating it here would mean a second\nformat to keep in step."
  -
    name: '41. Activity log'
    description: "\nسجل النشاط — who changed what, and when.\n\n**Read-only, and append-only underneath.** `ActivityPolicy` answers false to\ncreate, update and delete, and there are no write routes. A log that could\nbe edited is not a log.\n\nEach row carries the subject it is about (`subject_type` + `subject_id`), the\nuser who caused it, and the `properties` bag holding the before/after values\nthe model recorded. The properties are passed through as written: they are\nevidence, and reshaping evidence for presentation is how detail goes missing.\n\nThe log grows without limit, so the index is filtered rather than browsed —\n`filter[subject_type]` and `filter[subject_id]` together answer \"what\nhappened to this record\", which is the question that gets asked."
  -
    name: '42. Global search'
    description: "\nOne box, seven record types: operations, items, customers, suppliers,\npurchase orders, manufacturing orders and delivery vouchers.\n\nTwo decisions shape this endpoint.\n\n**It respects the caller's permissions per type.** A user who cannot view\nsuppliers gets no supplier results — not an empty list they might read as\n\"no such supplier\", but a response whose `types` array does not include\nsuppliers at all, so a client can say what was searched. A global search\nthat ignored per-type permissions would be the easiest way in the platform\nto confirm that a record exists without being allowed to read it.\n\n**It is deliberately shallow.** Each type returns at most `limit` rows\n(five by default, twenty at most) with just enough to render a result line\nand navigate to the record. It is a jump-to, not a report: anything that\nneeds filtering, sorting or paging belongs on that type's own index, which\nis where the query language lives.\n\nThe term is matched against the identifiers people actually type — a code, a\nnumber, a name — never against notes or descriptions, which would bury the\nexact match everyone is looking for under prose that merely mentions it."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain a token from <code>POST /auth/login</code> with your email, password and a device name. The plain-text token is returned <b>once</b> — store it in secure storage (e.g. <code>flutter_secure_storage</code>), never in shared preferences. Tokens expire; rotate them with <code>POST /auth/refresh</code> before <code>expires_at</code>. A token can be issued with narrowed abilities (e.g. <code>["inventory"]</code>) so a shared warehouse tablet cannot reach finance endpoints even if its account could.'
security:
  -
    default: []
